name: Build RunPod vLLM image with Depot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v3
      - uses: depot/setup-action@v1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: depot/build-push-action@v1
        with:
          project: zpwz3kph0r
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/t-ph525/runpod-vllm-hf-cache:latest
            ghcr.io/t-ph525/runpod-vllm-hf-cache:${{ github.sha }}
